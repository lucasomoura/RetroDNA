[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrodna"
version = "0.1.0"
description = "Game Design Reverse Engineering Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"

dependencies = [
    "pydantic>=2.11",
    "numpy>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
retrodna = "apps.cli:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.setuptools.package-data]
"apps.observer" = ["templates/*.lua"]
"apps.exporter" = ["templates/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
